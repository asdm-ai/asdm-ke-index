# =============================================================================
# KE Index 批量扫描 workflow
# -----------------------------------------------------------------------------
# 触发面（P2H-D3——公开仓库防注入红线：不使用 fork PR 触发类事件）：
#   - push（paths 仅 repos.yaml——清单变更即重扫）
#   - 手动触发面（单仓冒烟/全批首跑——Actions 页 dispatch）
#   - schedule（月度重扫——任务 5.2.1，2026-11-26 启用：每月 1 日 02:00 UTC；
#     schedule 事件无 inputs → scan_force 恒空 → 永不走 force 重扫轨）
#
# 按仓穿行（2026-11-25 用户裁决——日常扫描即产品验证目标）：
#   每仓单 job 内串行执行完整链路，任何子步失败即该仓任务失败（fail-fast:
#   false + max-parallel 1——单仓失败不级联取消其它仓，也不阻断尾部 census）：
#     ① scan        clone → import --defer-projection（仅 MySQL 落库）
#     ② projection  ke project <snapshotId>（Neo4j 投影——本 job 内显式子步）
#     ③ metrics     compute-metrics.py（MySQL 直查形态 → report）
#     ④ consistency graph-metrics.py --compare（图形态重算 + 双路径等价比对
#                   + 遥测差分——exit 2 MISMATCH 亦判失败）
#     ⑤ annotate    四子步结论落 pipeline-status/{owner}/{repo}.json（确定性
#                   产物入库）+ ::error:: 标注 + graph evidence artifact
#   子步门控：② ③ 仅要求 ① 成功（投影失败仍算指标——census 能聚合多少聚合
#   多少，但该仓任务已判失败）；④ 要求 ② ③ 均成功。凡"前序失败仍要跑"的
#   步骤 if 必须显式 (success() || failure())——GitHub Actions 对不含状态
#   函数的 if 隐式前缀 success()（run #31 实证：投影 403 后 metrics 被
#   意外 skip）。② 用 KE_ADMIN_API_KEY（tenant-admin——reproject 端点需要；
#   member 键 403，最小权限仅此步），其余子步仍用 KE_API_KEY（member）。
#   仓规模（2026-11-26）：① clone 后由 repo-scale.py 采集文件数 / 行数
#   （产物路径经 steps.scan.outputs.scale_json 传给 ③）→ ③ 经 --scale-json
#   并入 report D3.scale（含服务端 Repository.fileCount 对照）→ census
#   repos[] / cohort.scale。存量 report 由 scale-backfill.yml 补齐。
#   防风暴背景（Hotfix-14/15，B1/B3——原错峰轨 projection-sweep 已由穿行结构
#   取代）：穿行 = 单仓串行（max-parallel 1），投影天然独占窗口；服务端侧
#   obj_unique 唯一约束 + 投影并发上限 + 同快照互斥三重防护仍在位。
#
# job 流水（零漂移短路——服务端锚版，2026-11-19 优化）：
#   preflight（ls-remote 远端 HEAD vs 服务端快照 sourceVersion——import start
#   --commit <sha> 落锚；report 新鲜度双锚 cliVersion+snapshotId；命中即整 job
#   跳过）→ CLI 装配缓存（actions/cache 按版本键）→ scan（clone + import
#   --commit HEAD）→ 投影 → 指标 → 一致性 → 标注；存量 "head" 快照首轮全量
#   重导入一轮落新锚（迁移注记见 preflight-skip.sh 头注）；ops 删快照即不
#   命中→自然重建
# 并发护栏：matrix 并发上限（单实例吞吐——Plan R4）；run 级 concurrency
#   ke-index-scan（三触发面互斥——schedule/dispatch/push 重叠时后到者排队
#   而非并行：避免两轮扫描同时压服务端、同时向 main 提交 report）
# =============================================================================
name: scan

on:
  push:
    paths:
      - "repos.yaml"
  workflow_dispatch:
    inputs:
      scan_force:
        description: "重扫轨（R3）：true 时 scan-one 透传 --force——同 HEAD 异分析器版本强制重建（分析器升级后的口径修正重扫用）"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 1 * *"   # 每月 1 日 02:00 UTC（= 北京时间 10:00）

# 三触发面同一组：同一时刻至多一个 scan run 在跑，后到者排队（不取消在跑者）
concurrency:
  group: ke-index-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate scan matrix from repos.yaml
        id: gen
        run: |
          # ruby stdlib YAML 解析（runner 预装）→ jq 过滤 skip 并整形 matrix.include
          MATRIX=$(ruby -ryaml -rjson -e 'puts JSON.generate(YAML.load_file("repos.yaml"))' \
            | jq -c '{include: [.repos[] | select((.skip // false) | not) | {owner: .owner, repo: .repo, branch: (.branch // "")}]}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  scan:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false——单仓失败不级联取消其它仓（大仓 commit 504/超时属可预期
      # 形态，服务端后台继续处理，重跑 dispatch dedup skipped 即自愈；级联取消会
      # 浪费同批已跑一半的 job——2026-11-17 批 2 教训：1 失败取消 13）
      fail-fast: false
      # max-parallel 1（2026-11-17/18 用户裁决：单仓串行；2026-11-25 穿行结构
      # 沿用——串行是投影独占窗口与逐仓完整链路判读的前提，收口期稳定性
      # 优先，吞吐代价可接受）
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # 本地短路（零漂移轨·服务端锚）：ls-remote 远端 HEAD vs 服务端快照 sourceVersion
      # （import start --commit 落锚）+ report 新鲜度（cliVersion+snapshotId）；
      # ——命中即整 job 跳过（不装 CLI/不 clone/不跑穿行链）；force 轨永不跳过
      - name: Preflight (skip check)
        id: preflight
        env:
          KE_API_KEY: ${{ secrets.KE_API_KEY }}
          KE_SERVER_URL: ${{ secrets.KE_SERVER_URL }}
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
          BRANCH: ${{ matrix.branch }}
          SCAN_FORCE: ${{ inputs.scan_force }}
        run: bash scripts/preflight-skip.sh

      # CLI 装配缓存（matrix 每 job 独立 runner——按版本键共享安装产物：首 job 安装落缓存，
      # 后续 job 秒级恢复，等效"只装一次"；全批 skip 时本步与装配步均不执行）
      - name: Restore KE CLI cache
        id: cli_cache
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ke-cli
          key: ke-cli-${{ steps.preflight.outputs.cli_version }}-ubuntu-x64

      - name: Prepare KE CLI (install or cache-hit + PATH)
        if: steps.preflight.outputs.skip != 'true'
        env:
          KE_API_KEY: ${{ secrets.KE_API_KEY }}
          KE_SERVER_URL: ${{ secrets.KE_SERVER_URL }}
        run: |
          if [ "${{ steps.cli_cache.outputs.cache-hit }}" != "true" ]; then
            bash scripts/install-cli.sh "$RUNNER_TEMP/ke-cli"
          fi
          # ke 指令统一调用形态：装配（安装或缓存恢复）后注入 PATH；版本断言对缓存
          # 命中路径同样生效（防缓存陈旧/污染——与 install-cli.sh 断言同判据）
          echo "$RUNNER_TEMP/ke-cli/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/ke-cli/bin:$PATH" ke --version

      # 分桶 clone 缓存（B3）：按仓键恢复 clone 桶（矩阵 job 独立 runner——同仓
      # 重跑/重扫命中桶免全量 clone，scan-one.sh fetch --depth 1 增量刷新；
      # 桶体量受 GitHub 10GB 缓存配额 LRU 约束，超限自动逐出最旧仓）
      - name: Restore clone cache (bucketed per repo)
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clone-buckets
          key: clone-bucket-${{ matrix.owner }}-${{ matrix.repo }}-v1

      # ---- ① scan：clone + import --defer-projection（仅 MySQL 落库）----
      # defer 固定（穿行结构）：投影是本 job 下一显式子步（独立结论 + 独立失败面）
      - name: Scan ${{ matrix.owner }}/${{ matrix.repo }}
        id: scan
        if: steps.preflight.outputs.skip != 'true'
        env:
          KE_API_KEY: ${{ secrets.KE_API_KEY }}
          KE_SERVER_URL: ${{ secrets.KE_SERVER_URL }}
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
          BRANCH: ${{ matrix.branch }}
          SCAN_FORCE: ${{ inputs.scan_force }}
          DEFER_PROJECTION: "true"
          CLONE_CACHE_DIR: ${{ runner.temp }}/clone-buckets
        run: bash scripts/scan-one.sh

      # ---- ② projection：ke project <snapshotId>（Neo4j 投影——幂等可重跑）----
      # 门控：仅要求 ① 成功。失败 → 本仓任务失败（job conclusion 即失败），
      # 但 ③ 仍执行（MySQL 数据已在——census 能聚合多少聚合多少）
      # 凭据：KE_ADMIN_API_KEY（tenant-admin——POST /api/admin/maintenance/
      # reproject 需 platform-admin/tenant-admin；member 键 403 实证 run #31。
      # 最小权限：仅本步用 admin 键，import/metrics/consistency 仍用 member 键）
      # if 门控注记：GitHub Actions 对不含状态函数的 if 隐式前缀 success()——
      # 前序任何失败都会连带 skip 后续步（run #31 实证：投影 403 后 metrics
      # 被意外 skip）。凡"前序失败仍要跑"的步必须显式 (success() || failure())
      - name: Projection (ke project)
        id: projection
        if: (success() || failure()) && steps.scan.conclusion == 'success'
        env:
          KE_ADMIN_API_KEY: ${{ secrets.KE_ADMIN_API_KEY }}
          KE_SERVER_URL: ${{ secrets.KE_SERVER_URL }}
          SNAPSHOT_ID: ${{ steps.scan.outputs.snapshot_id }}
        run: |
          if [ -z "$SNAPSHOT_ID" ]; then
            echo "FAIL: scan 未产出 snapshot_id——无法键控投影" >&2
            exit 1
          fi
          ke --mode server --url "$KE_SERVER_URL" --token "$KE_ADMIN_API_KEY" \
            project "$SNAPSHOT_ID" --timeout-min 120

      # ---- ③ metrics：compute-metrics.py（MySQL 直查形态——投影无关）----
      # 门控：仅要求 ① 成功（投影失败仍算——该仓任务已判失败，report 照出；
      # 显式 (success() || failure()) 破隐式 success() 前缀——见 ② 注记）
      - name: Compute metrics report (${{ matrix.owner }}/${{ matrix.repo }})
        id: metrics
        if: (success() || failure()) && steps.scan.conclusion == 'success'
        env:
          KE_API_KEY: ${{ secrets.KE_API_KEY }}
          KE_SERVER_URL: ${{ secrets.KE_SERVER_URL }}
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
          SNAPSHOT_ID: ${{ steps.scan.outputs.snapshot_id }}
          SCALE_JSON: ${{ steps.scan.outputs.scale_json }}
        run: |
          ARGS=""
          if [ -n "$SNAPSHOT_ID" ]; then
            ARGS="--snapshot $SNAPSHOT_ID"
          fi
          # 仓规模采集产物（scan 子步 clone 后生成——见 scan-one.sh；缺省即透传，
          # 本地复算无此产物时不传 → report D3 无 scale 子对象）
          if [ -n "$SCALE_JSON" ]; then
            ARGS="$ARGS --scale-json $SCALE_JSON"
          fi
          python3 scripts/compute-metrics.py \
            --owner "$OWNER" --repo "$REPO" \
            --ke-cli "ke" \
            --source-head "${{ steps.scan.outputs.head }}" \
            $ARGS \
            --out "reports/$OWNER/$REPO.json"

      # ---- ④ consistency：graph-metrics.py --compare（图形态重算 + 双路径
      # 等价比对 + 遥测差分）----
      # 门控：② ③ 均成功（图形态依赖投影；比对目标依赖 report）。
      # 退出码契约：0=PASS / 2=MISMATCH / 1=崩溃——MISMATCH 亦判本仓任务失败
      # （穿行结构用户裁决：任何子步不通过即失败；证据照落 artifact 供定位）
      - name: Consistency check (graph form + equivalence)
        id: consistency
        if: (success() || failure()) && steps.projection.conclusion == 'success' && steps.metrics.conclusion == 'success'
        env:
          KE_API_KEY: ${{ secrets.KE_API_KEY }}
          KE_SERVER_URL: ${{ secrets.KE_SERVER_URL }}
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
          SNAPSHOT_ID: ${{ steps.scan.outputs.snapshot_id }}
        run: |
          ARGS=""
          if [ -n "$SNAPSHOT_ID" ]; then
            ARGS="--snapshot $SNAPSHOT_ID"
          fi
          set +e
          python3 scripts/graph-metrics.py \
            --owner "$OWNER" --repo "$REPO" \
            $ARGS \
            --out "graph-evidence/$OWNER-$REPO.graph.json" \
            --compare "reports/$OWNER/$REPO.json"
          RC=$?
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit $RC

      # graph evidence artifact（MISMATCH 时最需要落证据——失败也上传：
      # 显式 (success() || failure()) 破隐式 success() 前缀，否则一致性失败
      # （已置 job 失败态）时本步被意外 skip——恰是最需要证据的场景）：
      # 遥测含分位延迟（逐 run 波动）不入库，走 3 天保留期 artifact
      - name: Upload graph evidence
        if: (success() || failure()) && steps.consistency.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: graph-evidence-${{ matrix.owner }}-${{ matrix.repo }}
          path: graph-evidence/
          if-no-files-found: ignore
          retention-days: 3

      # ---- ⑤ annotate：四子步结论落 pipeline-status（确定性产物）----
      # 确定性：内容仅含 owner/repo/heads/快照/子步结论——同仓同快照重跑逐字节
      # 一致（无墙钟）→ 月度 dedup skip 不产生 git diff；scan 未被尝试
      # （preflight skip）时本步整体跳过——不覆盖上一轮的既有状态文件
      - name: Annotate pipeline status
        id: annotate
        if: always() && steps.scan.conclusion != 'skipped'
        env:
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
          SOURCE_HEAD: ${{ steps.scan.outputs.head }}
          SNAPSHOT_ID: ${{ steps.scan.outputs.snapshot_id }}
          OBJECT_COUNT: ${{ steps.scan.outputs.snapshot_count }}
          IMPORT_STATUS: ${{ steps.scan.outputs.import_status }}
          SCAN_C: ${{ steps.scan.conclusion }}
          PROJECTION_C: ${{ steps.projection.conclusion }}
          METRICS_C: ${{ steps.metrics.conclusion }}
          CONSISTENCY_C: ${{ steps.consistency.conclusion }}
          CONSISTENCY_RC: ${{ steps.consistency.outputs.rc }}
        run: bash scripts/pipeline-status.sh

      # 产物入库（bot 身份；matrix 并发推送冲突 → 分类重试）
      # if: always()——失败仓的 status 同样入库（审计面）；preflight skip 时
      # report 与 status 均无变化——无新增可提交，整步安静退出
      # push 重试按拒绝原因分类（run #33 hibernate-orm 教训：GitHub 瞬时 5xx
      # 连拒 5 次、旧循环总窗口仅 82s → status 未落库、该仓从 census validation
      # 静默消失）——非快进才 rebase；服务端瞬时错误不 rebase、指数退避，
      # 预算 15min。细节见 scripts/push-with-retry.sh 头注。
      # 本步失败 = 链路结论未落库 → 该仓 job 判失败（结论不可审计即视为未通过）；
      # census 的矩阵对账断言会把缺仓显式列出，不再静默。
      - name: Commit report + status
        if: always() && steps.annotate.conclusion != 'skipped'
        env:
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
        run: |
          git config user.name "ke-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports pipeline-status 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "report/status unchanged — no commit"
            exit 0
          fi
          git commit -m "report: pipeline for ${OWNER}/${REPO}"
          bash scripts/push-with-retry.sh

  # 任务 2.5.1：census 聚合——全批 scan 完成后单 job 聚合并 commit（守门 N<30
  # → accumulating 不出分位——P2H-D6；checkout 默认停在触发 commit，需 fetch
  # 拉齐 matrix 各 job 的 bot 提交后聚合）
  # 按仓穿行（2026-11-25）：needs: [scan] + if: always()——单仓/多仓失败均不
  # 阻断聚合，能聚合多少聚合多少（reports 区聚合成功产物；validation 区汇总
  # 全部 pipeline-status 含失败仓——产品验证面）
  # 矩阵对账（2026-11-26——run #33 hibernate-orm 教训）：链路 overall=pass 但
  # 末步 push 被 GitHub 5xx 连拒 → status 未落库 → validation 只见 40 仓且
  # 报"40/40 全过"（缺仓既不计 pass 也不计 fail）。prepare 的矩阵经 needs 传入
  # census.py --matrix-json 对账；缺仓入 validation.missingRepos/failedRepos、
  # ok=false。summary 仍写出并入库（聚合不被阻断），其后独立断言步据 ok 把
  # census job 置红——"能聚合多少聚合多少"与"缺仓必须可见"两者兼顾。
  census:
    needs: [prepare, scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest reports (bot commits from matrix jobs)
        env:
          SCAN_MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          # 矩阵落文件再以 @file 传入（env 传递——不把清单内容拼进 shell 源码）
          printf '%s' "$SCAN_MATRIX" > "$RUNNER_TEMP/scan-matrix.json"
          jq -e '.include | length' "$RUNNER_TEMP/scan-matrix.json"

      - name: Aggregate census summary (N gate + validation roll-up + matrix reconcile)
        run: python3 scripts/census.py --matrix-json "@$RUNNER_TEMP/scan-matrix.json"

      - name: Commit census summary
        run: |
          git config user.name "ke-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add census/
          if git diff --cached --quiet; then
            echo "census unchanged — no commit"
            exit 0
          fi
          git commit -m "census: aggregate summary (N gate)"
          bash scripts/push-with-retry.sh

      # 断言独立于提交步之后：缺仓时 summary（含 missingRepos）已入库可查，
      # 再把 job 置红——run 结论不再掩盖"某仓结论未落库"
      - name: Assert validation (every matrix repo has pipeline-status)
        run: |
          if ! jq -e '.validation.ok == true' census/summary.json > /dev/null; then
            jq -r '.validation.missingRepos[] | "::error title=census validation::缺少 pipeline-status（链路结论未落库，需补跑该仓）：" + .' census/summary.json
            echo "FAIL: validation.ok=false——见 census/summary.json validation.missingRepos" >&2
            exit 1
          fi
          echo "validation.ok=true（矩阵 $(jq -r '.validation.expectedRepos' census/summary.json) 仓均有 pipeline-status）"

      # ---- 文档：census 入库且矩阵对账通过后，重建入口页与 docs/ ----
      # 门控一：本步隐含 success() 前缀——上一断言步失败（缺仓）即不更新文档。
      # 门控二：生成器自带——任一仓管线未通过即 exit 1、不写文件。入口页不会带着
      # "N 个仓失败"自动发布；旧基线文档保持原样，本 job 置红。
      # completed_at 取本轮最后一个已完成 job 的完成时刻（Actions API）：文档里的
      # "用时"是扫描用时，不含 census 与文档步自身。job 数超过一页即失败（不静默截断）。
      # 基线元数据随文档写入 docs/baseline.json——此后可用 docs.yml 逐字节复现。
      - name: Render documentation
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          JOBS="$(curl -sS -f -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"
          TOTAL="$(jq -r '.total_count' <<<"$JOBS")"
          if [ "$TOTAL" -gt 100 ]; then
            echo "FAIL: run has $TOTAL jobs; the one-page jobs query would be truncated" >&2
            exit 1
          fi
          COMPLETED_AT="$(jq -r '[.jobs[].completed_at | select(. != null)] | max // empty' <<<"$JOBS")"
          if [ -z "$COMPLETED_AT" ]; then
            echo "FAIL: run $GITHUB_RUN_ID has no finished job" >&2
            exit 1
          fi
          python3 scripts/render-docs.py \
            --run-id "$GITHUB_RUN_ID" --run-number "$GITHUB_RUN_NUMBER" \
            --started-at "$RUN_STARTED_AT" --completed-at "$COMPLETED_AT"

      - name: Validate documentation
        run: python3 scripts/validate-docs.py

      - name: Commit documentation
        run: |
          git config user.name "ke-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_zh-cn.md docs
          if git diff --cached --quiet; then
            echo "documentation unchanged — no commit"
            exit 0
          fi
          git commit -m "docs: rebuild on run #${GITHUB_RUN_NUMBER}"
          bash scripts/push-with-retry.sh
