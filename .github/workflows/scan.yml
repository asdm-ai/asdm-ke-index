# =============================================================================
# KE Index 批量扫描 workflow
# -----------------------------------------------------------------------------
# 触发面（P2H-D3——公开仓库防注入红线：不使用 fork PR 触发类事件）：
#   - push（paths 仅 repos.yaml——清单变更即重扫）
#   - 手动触发面（单仓冒烟/全批首跑——Actions 页 dispatch）
#   - schedule（月度重扫——聚合轮启用，启用前保持注释态）
# 并发护栏：matrix 并发上限（单实例吞吐——Plan R4）
# =============================================================================
name: scan

on:
  push:
    paths:
      - "repos.yaml"
  workflow_dispatch:
  # schedule:
  #   - cron: "0 2 1 * *"   # 每月 1 日 02:00 UTC（聚合轮启用）

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate scan matrix from repos.yaml
        id: gen
        run: |
          # ruby stdlib YAML 解析（runner 预装）→ jq 过滤 skip 并整形 matrix.include
          MATRIX=$(ruby -ryaml -rjson -e 'puts JSON.generate(YAML.load_file("repos.yaml"))' \
            | jq -c '{include: [.repos[] | select((.skip // false) | not) | {owner: .owner, repo: .repo, branch: (.branch // "")}]}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  scan:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install KE CLI
        env:
          KE_API_KEY: ${{ secrets.KE_API_KEY }}
          KE_SERVER_URL: ${{ secrets.KE_SERVER_URL }}
        run: bash scripts/install-cli.sh "$RUNNER_TEMP/ke-cli"

      - name: Scan ${{ matrix.owner }}/${{ matrix.repo }}
        env:
          KE_API_KEY: ${{ secrets.KE_API_KEY }}
          KE_SERVER_URL: ${{ secrets.KE_SERVER_URL }}
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
          BRANCH: ${{ matrix.branch }}
          CLI_DIR: ${{ runner.temp }}/ke-cli
        run: bash scripts/scan-one.sh

      # 任务 2.3.1：L1 指标计算——scan-one 成功后执行（dedup skipped 同样出报告：
      # 数值未变时产物逐字节一致，commit 步骤自动跳过）
      - name: Compute metrics report (${{ matrix.owner }}/${{ matrix.repo }})
        env:
          KE_API_KEY: ${{ secrets.KE_API_KEY }}
          KE_SERVER_URL: ${{ secrets.KE_SERVER_URL }}
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
          CLI_DIR: ${{ runner.temp }}/ke-cli
        run: |
          python3 scripts/compute-metrics.py \
            --owner "$OWNER" --repo "$REPO" \
            --ke-cli "node $CLI_DIR/bin/ke.cjs" \
            --out "reports/$OWNER/$REPO.json"

      # 产物入库（bot 身份；matrix 并发推送冲突 → fetch+rebase 重试）
      - name: Commit report
        env:
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
        run: |
          git config user.name "ke-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "report unchanged — no commit"
            exit 0
          fi
          git commit -m "report: metrics for ${OWNER}/${REPO}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push conflict (attempt $i) — fetch + rebase retry"
            git fetch origin
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; echo "FAIL: rebase conflict" >&2; exit 1; }
            sleep $((i * 5))
          done
          echo "FAIL: push retries exhausted" >&2
          exit 1

  # 任务 2.5.1：census 聚合——全批 scan job 完成后单 job 聚合并 commit
  # （守门 N<30 → accumulating 不出分位——P2H-D6；checkout 默认停在触发 commit，
  #  需 fetch 拉齐 matrix 各 job 的 bot report 提交后聚合）
  census:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest reports (bot commits from matrix jobs)
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Aggregate census summary (N gate)
        run: python3 scripts/census.py

      - name: Commit census summary
        run: |
          git config user.name "ke-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add census/
          if git diff --cached --quiet; then
            echo "census unchanged — no commit"
            exit 0
          fi
          git commit -m "census: aggregate summary (N gate)"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push conflict (attempt $i) — fetch + rebase retry"
            git fetch origin
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; echo "FAIL: rebase conflict" >&2; exit 1; }
            sleep $((i * 5))
          done
          echo "FAIL: push retries exhausted" >&2
          exit 1
