# =============================================================================
# KE Index 批量扫描 workflow
# -----------------------------------------------------------------------------
# 触发面（P2H-D3——公开仓库防注入红线：不使用 fork PR 触发类事件）：
#   - push（paths 仅 repos.yaml——清单变更即重扫）
#   - 手动触发面（单仓冒烟/全批首跑——Actions 页 dispatch）
#   - schedule（月度重扫——聚合轮启用，启用前保持注释态）
# job 流水（零漂移短路——2026-11-19 优化）：
#   preflight（ls-remote 远端 HEAD vs report 锚 cliVersion+sourceHead，命中即整 job
#   跳过）→ CLI 装配缓存（actions/cache 按版本键——matrix 独立 runner 间共享安装
#   产物，等效只装一次）→ scan（clone+import，提取源仓 HEAD）→ metrics（--source-head
#   落 report）→ commit；注意 ops 删服务端快照后需 scan_force 或删对应 report
# 并发护栏：matrix 并发上限（单实例吞吐——Plan R4）
# =============================================================================
name: scan

on:
  push:
    paths:
      - "repos.yaml"
  workflow_dispatch:
    inputs:
      scan_force:
        description: "重扫轨（R3）：true 时 scan-one 透传 --force——同 HEAD 异分析器版本强制重建（分析器升级后的口径修正重扫用）"
        type: boolean
        default: false
  # schedule:
  #   - cron: "0 2 1 * *"   # 每月 1 日 02:00 UTC（聚合轮启用）

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate scan matrix from repos.yaml
        id: gen
        run: |
          # ruby stdlib YAML 解析（runner 预装）→ jq 过滤 skip 并整形 matrix.include
          MATRIX=$(ruby -ryaml -rjson -e 'puts JSON.generate(YAML.load_file("repos.yaml"))' \
            | jq -c '{include: [.repos[] | select((.skip // false) | not) | {owner: .owner, repo: .repo, branch: (.branch // "")}]}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  scan:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false——单仓失败不级联取消其它仓（大仓 commit 504/超时属可预期
      # 形态，服务端后台继续处理，重跑 dispatch dedup skipped 即自愈；级联取消会
      # 浪费同批已跑一半的 job——2026-11-17 批 2 教训：1 失败取消 13）
      fail-fast: false
      # max-parallel 2→1（2026-11-17/18 用户裁决：单仓串行——批 2 重跑 #2（4 并发）时段
      # 出现 Lock wait timeout / Pool closed / JSON 解析失败等资源竞争失败；2 并发因
      # 服务器 Azure 平台关机（16:04:18 有序 shutdown——非扫描压力所致）未经充分验证，
      # 收口期采用最保守的完全串行。代价：批次总时长最长，S0 铺底优先稳定性）
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # 本地短路（零漂移轨）：ls-remote 远端 HEAD vs report 锚（cliVersion + sourceHead）
      # ——命中即整 job 跳过（不装 CLI/不 clone/不 import/不跑 metrics）；force 轨永不跳过
      - name: Preflight (skip check)
        id: preflight
        env:
          KE_API_KEY: ${{ secrets.KE_API_KEY }}
          KE_SERVER_URL: ${{ secrets.KE_SERVER_URL }}
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
          BRANCH: ${{ matrix.branch }}
          SCAN_FORCE: ${{ inputs.scan_force }}
        run: bash scripts/preflight-skip.sh

      # CLI 装配缓存（matrix 每 job 独立 runner——按版本键共享安装产物：首 job 安装落缓存，
      # 后续 job 秒级恢复，等效"只安装一次"；全批 skip 时本步与装配步均不执行）
      - name: Restore KE CLI cache
        id: cli_cache
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ke-cli
          key: ke-cli-${{ steps.preflight.outputs.cli_version }}-ubuntu-x64

      - name: Prepare KE CLI (install or cache-hit + PATH)
        if: steps.preflight.outputs.skip != 'true'
        env:
          KE_API_KEY: ${{ secrets.KE_API_KEY }}
          KE_SERVER_URL: ${{ secrets.KE_SERVER_URL }}
        run: |
          if [ "${{ steps.cli_cache.outputs.cache-hit }}" != "true" ]; then
            bash scripts/install-cli.sh "$RUNNER_TEMP/ke-cli"
          fi
          # ke 指令统一调用形态：装配（安装或缓存恢复）后注入 PATH；版本断言对缓存
          # 命中路径同样生效（防缓存陈旧/污染——与 install-cli.sh 断言同判据）
          echo "$RUNNER_TEMP/ke-cli/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/ke-cli/bin:$PATH" ke --version

      - name: Scan ${{ matrix.owner }}/${{ matrix.repo }}
        id: scan
        if: steps.preflight.outputs.skip != 'true'
        env:
          KE_API_KEY: ${{ secrets.KE_API_KEY }}
          KE_SERVER_URL: ${{ secrets.KE_SERVER_URL }}
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
          BRANCH: ${{ matrix.branch }}
          SCAN_FORCE: ${{ inputs.scan_force }}
        run: bash scripts/scan-one.sh

      # 任务 2.3.1：L1 指标计算——scan-one 成功后执行（dedup skipped 同样出报告：
      # 数值未变时产物逐字节一致，commit 步骤自动跳过）；--source-head 落 report
      # 供下轮 preflight 跳过判据用
      - name: Compute metrics report (${{ matrix.owner }}/${{ matrix.repo }})
        if: steps.preflight.outputs.skip != 'true'
        env:
          KE_API_KEY: ${{ secrets.KE_API_KEY }}
          KE_SERVER_URL: ${{ secrets.KE_SERVER_URL }}
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
        run: |
          python3 scripts/compute-metrics.py \
            --owner "$OWNER" --repo "$REPO" \
            --ke-cli "ke" \
            --source-head "${{ steps.scan.outputs.head }}" \
            --out "reports/$OWNER/$REPO.json"

      # 产物入库（bot 身份；matrix 并发推送冲突 → fetch+rebase 重试）
      # （preflight skip 时 report 未变——无新增可提交，整步跳过）
      - name: Commit report
        if: steps.preflight.outputs.skip != 'true'
        env:
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
        run: |
          git config user.name "ke-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "report unchanged — no commit"
            exit 0
          fi
          git commit -m "report: metrics for ${OWNER}/${REPO}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push conflict (attempt $i) — fetch + rebase retry"
            git fetch origin
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; echo "FAIL: rebase conflict" >&2; exit 1; }
            sleep $((i * 5))
          done
          echo "FAIL: push retries exhausted" >&2
          exit 1

  # 任务 2.5.1：census 聚合——全批 scan job 完成后单 job 聚合并 commit
  # （守门 N<30 → accumulating 不出分位——P2H-D6；checkout 默认停在触发 commit，
  #  需 fetch 拉齐 matrix 各 job 的 bot report 提交后聚合）
  census:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest reports (bot commits from matrix jobs)
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Aggregate census summary (N gate)
        run: python3 scripts/census.py

      - name: Commit census summary
        run: |
          git config user.name "ke-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add census/
          if git diff --cached --quiet; then
            echo "census unchanged — no commit"
            exit 0
          fi
          git commit -m "census: aggregate summary (N gate)"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push conflict (attempt $i) — fetch + rebase retry"
            git fetch origin
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; echo "FAIL: rebase conflict" >&2; exit 1; }
            sleep $((i * 5))
          done
          echo "FAIL: push retries exhausted" >&2
          exit 1
