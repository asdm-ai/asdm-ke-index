# =============================================================================
# KE Index 扫描清单（schema v1）
# -----------------------------------------------------------------------------
# 字段：
#   owner          GitHub 组织/用户名（必填）
#   repo           仓库名（必填；亦为导入 sourceId——clone 目录名）
#   branch         分支（可选——缺省 clone 默认分支）
#   skip           是否跳过本轮扫描（缺省 false）
#   notes          入选理由/备注（可选；首字符为分层标记 A/B/C/D）
#   frontend-pair  前后端配对扩展位（多仓聚合轮启用——暂为注释占位，不参与解析）
#
# 约定：
#   - owner 归属由本清单与 report 元数据承载（sourceId 仅取 repo 名，不含斜杠）
#   - 修改本文件并 push 会触发批量扫描 workflow（paths 过滤仅限本文件）
#   - 单仓入列硬约束：公开仓、非镜像仓、可被扫描管线解析（Java 主导或前端配对形态）
#
# S0 铺底分层选样（41 仓——2026-11-17 定稿，P5H-D6 配额）：
#   A. Java admin/业务系统 18——脚手架与业务系统形态（MyBatis/MP/JPA 混合）
#   B. 大型仓 8——超大型多模块（Gradle 轨 + 规模极端样本）
#   C. JPA 数据访问层 8——与 MyBatis 系对照的 JPA 形态（含 JPA 实现本体）
#   D. 前后端配对 7——A 层仓的官方前端仓（配对聚合轮未启用，先单列为前端形态样本）
#
#   当前批次：2/4（30 仓落库）——分批 push ≤10 新仓/批，批序即提交序
# =============================================================================

