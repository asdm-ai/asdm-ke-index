# =============================================================================
# KE Index 扫描清单（schema v1）
# -----------------------------------------------------------------------------
# 字段：
#   owner          GitHub 组织/用户名（必填）
#   repo           仓库名（必填；亦为导入 sourceId——clone 目录名）
#   branch         分支（可选——缺省 clone 默认分支）
#   skip           是否跳过本轮扫描（缺省 false）
#   notes          入选理由/备注（可选）
#   frontend-pair  前后端配对扩展位（多仓聚合轮启用——暂为注释占位，不参与解析）
#
# 约定：
#   - owner 归属由本清单与 report 元数据承载（sourceId 仅取 repo 名，不含斜杠）
#   - 修改本文件并 push 会触发批量扫描 workflow（paths 过滤仅限本文件）
#
# 种子批分层选样（10 仓——2026-10-20 定稿）：
#   A. Java admin/业务系统 6——主流脚手架与业务系统形态（Maven 系为主）
#   B. 大型仓 2——超大型多模块（Gradle 轨 + 规模极端样本）
#   C. JPA 数据访问层 2——与 MyBatis 系对照的 JPA 形态
# =============================================================================

repos:
  # ---- 分层 A：Java admin/业务系统（6）----
  - owner: macrozheng
    repo: mall
    branch: master
    skip: false
    notes: "A·SpringBoot + MyBatis 电商系统——单仓全管线冒烟基线（2026-10-19 首跑即此仓）"
    # frontend-pair: <owner>/<repo>（前后端配对聚合用——扩展位占位）
  - owner: macrozheng
    repo: mall-swarm
    skip: false
    notes: "A·SpringCloud 微服务电商（mall 同域多模块变体——组件化依赖形态）"
  - owner: yangzongzhuan
    repo: RuoYi-Vue
    skip: false
    notes: "A·最流行 Java admin 脚手架（SpringBoot + MyBatis 多模块——RuoYi 系基线）"
  - owner: dromara
    repo: RuoYi-Vue-Plus
    skip: false
    notes: "A·RuoYi 社区增强重写（MyBatis-Plus + Sa-Token——同源脚手架不同技术栈对照）"
  - owner: jeecgboot
    repo: JeecgBoot
    skip: false
    notes: "A·低代码平台（前后端同仓——Vue3 前端轨大样本：Module/Component/Function/Route）"
  - owner: lenve
    repo: vhr
    skip: false
    notes: "A·微人事管理系统（前后端同仓——Vue2 前端轨小样本，与 JeecgBoot Vue3 对照）"
  # ---- 分层 B：大型仓（2）----
  - owner: apache
    repo: dubbo
    skip: false
    notes: "B·Apache RPC 框架（Gradle 多模块超大型纯框架——无表/映射层的 A 层极端样本）"
  - owner: apache
    repo: fineract
    skip: false
    notes: "B·Apache 金融核心系统（Gradle 多模块超大型业务系统——大表量 DDL 轨）"
  # ---- 分层 C：JPA 数据访问层（2）----
  - owner: spring-projects
    repo: spring-petclinic
    skip: false
    notes: "C·Spring Data JPA 经典（小体量对照锚——无 MyBatis Mapper 的 A 层变体）"
  - owner: elunez
    repo: eladmin
    skip: false
    notes: "C·SpringBoot + Spring Data JPA admin 系统（JPA 业务系统代表——与 MyBatis 系对照）"
