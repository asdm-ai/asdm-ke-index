  # aos-server 4 分钟内连续 5 次 V8 heap OOM 并自动重启，druid 快照滞留 importing
  # （Hotfix-18 复发；根因候选见该条立案）。server 侧修复上线前保持源码模式，不得加回。
  - owner: apache
