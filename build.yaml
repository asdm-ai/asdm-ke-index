    tool: maven
    jdk: 21

  # ---- 批 1：A 层，Maven，构建文件在仓根（7）----
  - owner: yangzongzhuan
    repo: RuoYi-Vue
    tool: maven
    jdk: 17
  - owner: yangzongzhuan
    repo: RuoYi-Cloud
    tool: maven
    jdk: 17
  - owner: newbee-ltd
    repo: newbee-mall
    tool: maven
    jdk: 8
  - owner: renrenio
    repo: renren-fast
    tool: maven
    jdk: 8
  - owner: stylefeng
    repo: Guns
    tool: maven
    jdk: 17
  - owner: YunaiV
